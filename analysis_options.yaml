# Static analysis configuration for Shiksha.
#
# Based on the recommended Flutter lint set, with generated code excluded
# and a couple of project-wide conventions enforced.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Freezed factory-constructor parameters legitimately carry @JsonKey;
    # the annotation is copied onto the generated fields.
    invalid_annotation_target: ignore

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    require_trailing_commas: true
    directives_ordering: true
    unnecessary_lambdas: true
