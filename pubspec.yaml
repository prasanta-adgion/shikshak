name: shiksha
description: "Shiksha — Find the Right Teacher. Learn Without Limits."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0

  # Secure persistence
  flutter_secure_storage: ^9.2.4

  # Immutable models & serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
