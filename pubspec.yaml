name: Shikshak
description: "Shikshak — Find the Right Teacher. Learn Without Limits."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^16.0.0

  # Networking
  dio: ^5.9.0

  # Secure persistence
  flutter_secure_storage: ^9.2.4

  # OTP text field
  pinput: ^6.0.2

  equatable: ^2.1.0

  # Steps
  timelines_plus: ^2.0.0

  # check API request & response
  network_logger: ^1.0.4

  # camera/gallery selection
  image_picker: ^1.2.3

  # documents, certificates, notes, and any file uploads
  file_picker: ^11.0.2

  # crop image
  image_cropper: ^12.2.1
  lottie: ^3.3.3
  cached_network_image: ^3.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.2
  build_runner: ^2.15.1
  # Pinned below 2.15.2, which requires Dart ^3.11.0 — this project is on 3.10.0.
 

flutter:
  uses-material-design: true

  assets:
    - assets/student_images/
    - assets/teacher_images/
    - assets/shared_images/
    - assets/fonts/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide-Regular.ttf
